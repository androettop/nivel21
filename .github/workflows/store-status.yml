name: React to store publication

# The stores publish a version only after their review. Poll a store and react
# to the release announcement on Discord once it's serving the new version.
# Called by one scheduled workflow per store: release.yml enables them on each
# release and each one disables itself once its store is published, so they
# only run while a store is pending.
on:
  workflow_call:
    inputs:
      store:
        description: "Store to check (firefox or chrome)"
        required: true
        type: string
      workflow:
        description: "Calling workflow file, disabled once the store is published"
        required: true
        type: string

jobs:
  react:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Load latest release message
        id: release
        run: |
          tag=$(gh release view --json tagName --jq '.tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release download "$tag" --pattern discord-message.json; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Discord message saved for $tag"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: React if published
        id: react
        if: steps.release.outputs.found == 'true'
        run: node ./scripts/react_store_status.mjs "${{ steps.release.outputs.tag }}" discord-message.json "${{ inputs.store }}"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      - name: Stop polling
        if: steps.release.outputs.found != 'true' || steps.react.outputs.done == 'true'
        run: gh workflow disable "${{ inputs.workflow }}" --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
