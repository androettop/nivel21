name: React to Firefox publication

on:
  schedule:
    # Off the round minutes: GitHub delays or drops schedules there.
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  react:
    uses: ./.github/workflows/store-status.yml
    with:
      store: firefox
      workflow: store-status-firefox.yml
    secrets: inherit
